<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习笔记</title>
  <!-- 引入 Bootstrap 的 CSS 文件 (使用CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-light bg-light mb-4 border">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'learning_logs:index' %}">
        Learning Log</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarCollapse" aria-controls="navbarCollapse"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'learning_logs:topics' %}">
              主题</a></li>
        </ul> <!-- 定义导航栏左侧链接的代码到此结束 -->

        <!-- 与账户相关的链接 -->
        <ul class="navbar-nav ms-auto mb-2 mb-md-0">

          {% if user.is_authenticated %}
            <li class="nav-item">
              <span class="navbar-text me-2">你好, {{ user.username }}.</span>
            </li>
<li class="nav-item d-flex align-items-center">
  <form action="{% url 'accounts:logout' %}" method="post" class="d-inline">
    {% csrf_token %}
    <button type="submit" class="nav-link btn btn-link p-0 border-0">退出登录</button>
  </form>
</li>
          {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:register' %}">
                注册</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:login' %}">
                登录</a>
            </li>
          {% endif %}

        </ul> <!-- 与账户相关的链接到此结束 -->

      </div> <!-- 定义导航栏可折叠部分的代码到此结束 -->

    </div> <!-- 定义导航栏容器的代码到此结束 -->
  </nav> <!-- 定义导航栏的代码到此结束 -->



  {% block content %}{% endblock content %}

  <!-- 引入 Bootstrap 的 JS 文件 (使用CDN，用于实现导航栏折叠等交互) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
