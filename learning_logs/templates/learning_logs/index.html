{% extends 'learning_logs/base.html' %}

{% block content %}

  <div class="p-5 mb-4 bg-light rounded-3 border">
    <div class="container-fluid py-5">
      <h1 class="display-5 fw-bold">学习笔记</h1>
      <p class="col-md-8 fs-4">
        记录你的学习主题和条目，随时回顾自己的成长轨迹。
      </p>

      {% if user.is_authenticated %}
        <a class="btn btn-primary btn-lg" href="{% url 'learning_logs:topics' %}">
          进入主题
        </a>
      {% else %}
        <a class="btn btn-primary btn-lg me-2" href="{% url 'accounts:register' %}">
          注册
        </a>
        <a class="btn btn-outline-secondary btn-lg" href="{% url 'accounts:login' %}">
          登录
        </a>
      {% endif %}
    </div>
  </div>

{% endblock content %}
